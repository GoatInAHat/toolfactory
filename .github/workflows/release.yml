# Generated by toolfactory. Do not edit; run `toolfactory build` to regenerate.
# `gate` decides once which registries this tag can publish to (a job-level `if` cannot read
# secrets) and every leg obeys its output, so a tag with no secrets is still green: gate,
# package, the Release, and whatever else applies. After adding a secret, re-run with
# `gh workflow run release.yml -f tag=vX.Y.Z` — never `gh run rerun`, which replays the
# original run's secret snapshot. `release` first retracts every registry a surface dropped
# since the previous tag published to (git is the ledger; `toolfactory unpublish`), and
# `toolfactory secrets status` / `bootstrap-repo` cover the one-time steps that are left.
#
# Pages must be enabled with Source = GitHub Actions once (`toolfactory bootstrap-repo` does
# it through gh); until then the gate skips the Pages pair with a notice.

name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag to release: an existing one to publish again (e.g. after adding a secret), or a new one to cut at this branch's head"
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TOOLFACTORY_SYSTEM_NATIVE_JOBS: "true"
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      npm: ${{ steps.presence.outputs.npm }}
      oci: ${{ steps.presence.outputs.oci }}
      mcp_registry: ${{ steps.presence.outputs.mcp_registry }}
      pages: ${{ steps.presence.outputs.pages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - id: tag
        name: the commit this tag releases
        run: sha=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || git rev-parse HEAD) && git checkout -q "$sha" && echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: tag matches plugin.json
        run: test "v$(node -p "require('./plugin.json').version")" = "$RELEASE_TAG"
      - name: Restore Hermes
        id: hermes
        uses: actions/cache@v4
        with:
          path: |-
            ~/.hermes
            ~/.local/bin/hermes*
            ~/.local/share/uv/python
          key: hermes-${{ runner.os }}-180291162ff4df0d42b5dc4fecd08005cf7cebf9
      - name: Install Hermes
        if: steps.hermes.outputs.cache-hit != 'true'
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --commit 180291162ff4df0d42b5dc4fecd08005cf7cebf9 --skip-setup --skip-browser --skip-computer-use --non-interactive --no-skills
      - name: Hermes on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm run --if-present build
      - name: toolfactory check
        run: npx toolfactory check
      - name: toolfactory build (output files)
        run: npx toolfactory build
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Install Chromium dependencies
        run: npx --yes playwright install-deps chromium
      - name: toolfactory validate
        run: npx toolfactory validate
      - name: author checks
        run: pnpm run --if-present check
      - name: author tests
        run: pnpm test
      - name: author integration tests
        run: pnpm run --if-present test:integration
      - name: openclaw end-to-end (scripted model, no LLM key)
        run: npm --prefix hosts/openclaw run --if-present test:e2e
      - id: presence
        name: which registries this tag can publish to
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHER: ${{ vars.NPM_TRUSTED_PUBLISHER }}
        run: |-
          npm=false; if [ "$NPM_TRUSTED_PUBLISHER" = true ] || [ -n "$NPM_TOKEN" ]; then npm=true; else echo "::notice::npm: not published at this tag — https://www.npmjs.com/settings/~/tokens"; fi; echo "npm=$npm" >> "$GITHUB_OUTPUT"
          oci=false; if echo "::notice::ghcr.io publishes a private image on the first push whatever the repository's visibility; make it public once at https://github.com/goatinahat?tab=packages -> Package settings -> Danger Zone."; then oci=true; else echo "::notice::oci: not published at this tag — https://github.com/settings/packages"; fi; echo "oci=$oci" >> "$GITHUB_OUTPUT"
          mcp_registry=false; if [ "$npm" = true ] && [ "$oci" = true ]; then mcp_registry=true; else echo "::notice::mcp-registry: not published at this tag — https://registry.modelcontextprotocol.io"; fi; echo "mcp_registry=$mcp_registry" >> "$GITHUB_OUTPUT"
          pages=false; if gh api repos/GoatInAHat/toolfactory/pages >/dev/null 2>&1; then pages=true; else echo "::notice::pages: not published at this tag — https://github.com/GoatInAHat/toolfactory/settings/pages"; fi; echo "pages=$pages" >> "$GITHUB_OUTPUT"
  package:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: release directory
        run: rm -rf dist/release && mkdir -p dist/release
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm run --if-present build
      - name: toolfactory build (output files)
        run: npx toolfactory build
      - name: web build
        run: npm -C web ci && npm -C web run build
        env:
          PAGES_BASE: /
      - name: npm tarball
        run: npm pack --pack-destination dist/release
      - name: MCPB bundle
        run: rm -rf dist/mcpb && mkdir -p dist/mcpb && tar -xzf dist/release/toolfactory-0.2.1.tgz -C dist/mcpb --strip-components=1 && npm --prefix dist/mcpb install --omit=dev --ignore-scripts && cp hosts/mcpb/manifest.json dist/mcpb/manifest.json && npx -y @anthropic-ai/mcpb@2.1.2 pack dist/mcpb dist/release/toolfactory.mcpb
      - name: OpenClaw plugin tarball
        run: npm --prefix hosts/openclaw install && npm --prefix hosts/openclaw run build && npm pack ./hosts/openclaw --pack-destination dist/release
      - name: DSH bundle tarball
        run: npm pack ./hosts/dsh --pack-destination dist/release
      - name: plugin bundle
        run: set -- plugin.json mcp.json skills .claude-plugin .codex-plugin .cursor-plugin; for path in LICENSE LICENSE.md LICENSE.txt NOTICE NOTICE.md NOTICE.txt; do if [ -f "$path" ]; then set -- "$@" "$path"; fi; done; zip -qr dist/release/toolfactory-plugin.zip "$@"
      - name: web tarball
        run: tar -czf dist/release/toolfactory-web.tar.gz -C web/dist .
      - name: coverage report
        run: cp COVERAGE.md dist/release/ && npx toolfactory coverage > dist/release/coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/
  publish-npm:
    needs:
      - gate
      - package
    if: needs.gate.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_TRUSTED_PUBLISHER: ${{ vars.NPM_TRUSTED_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: npm publish
        env:
          NPM_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHER != 'true' && secrets.NPM_TOKEN || '' }}
        run: 'if npm view toolfactory@0.2.1 version >/dev/null 2>&1; then echo "::notice::npm: toolfactory@0.2.1 already published; skipping immutable version."; elif [ "$NPM_TRUSTED_PUBLISHER" = true ]; then npm publish ./release-assets/toolfactory-0.2.1.tgz --access public; else NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish ./release-assets/toolfactory-0.2.1.tgz --access public; fi'
  publish-oci:
    needs: gate
    if: needs.gate.outputs.oci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/goatinahat/toolfactory
          tags: type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
          labels: io.modelcontextprotocol.server.name=io.github.GoatInAHat/toolfactory
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  publish-mcp-registry:
    needs:
      - gate
      - publish-npm
      - publish-oci
    if: needs.gate.outputs.mcp_registry == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc && ./mcp-publisher publish
  release:
    needs:
      - gate
      - package
      - publish-npm
      - publish-oci
      - publish-mcp-registry
    if: ${{ !cancelled() && needs.package.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm run --if-present build
      - name: unpublish dropped registries
        run: npx toolfactory unpublish
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
  pages-build:
    needs: gate
    if: needs.gate.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm run --if-present build
      - name: toolfactory build (output files)
        run: npx toolfactory build
      - uses: actions/configure-pages@v5
      - name: web build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm -C web ci && npm -C web run build
      - name: publish the schema and the coverage report alongside the app
        run: cp dev.toolfactory/tool.schema.json COVERAGE.md web/dist/ && npx toolfactory coverage > web/dist/coverage.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
