# Generated by toolfactory. Do not edit; run `toolfactory build` to regenerate.
# v0: no per-registry release-ledger (spec §7 defers it) — a partial failure across legs
# needs manual triage; a re-run is not yet skip-succeeded-legs safe.
#
# One-time human setup (no API, so not automated here): register a GitHub trusted
# publisher for this repo + this workflow filename on npmjs.com / pypi.org.

name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present build
      - name: toolfactory check
        run: npx toolfactory check
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Install Hermes
        run: |-
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --commit 180291162ff4df0d42b5dc4fecd08005cf7cebf9 --skip-setup --skip-browser --skip-computer-use --non-interactive --no-skills
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: toolfactory validate
        run: npx toolfactory validate
      - name: author checks
        run: pnpm run --if-present check
      - name: author tests
        run: pnpm test
  publish-npm:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile && pnpm run --if-present build && npm publish --provenance
  publish-mcp-registry:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc && ./mcp-publisher publish
