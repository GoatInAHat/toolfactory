# Generated by toolfactory. Do not edit; run `toolfactory build` to regenerate.

name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present build
      - name: toolfactory check
        run: npx toolfactory check
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Install Chromium dependencies
        run: npx --yes playwright install-deps chromium
      - name: Install Hermes
        run: |-
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --commit 180291162ff4df0d42b5dc4fecd08005cf7cebf9 --skip-setup --skip-browser --skip-computer-use --non-interactive --no-skills
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: toolfactory validate
        run: npx toolfactory validate
        if: matrix.node-version == '24'
      - name: author checks
        run: pnpm run --if-present check
      - name: author tests
        run: pnpm test
