[project]
name = "toolfactory-hermes-plugin"
version = "0.1.0"
description = "Build an agent tool once; ship it as Agent Skills, MCP servers, Agent Plugins / Claude / Codex / Cursor bundles, OpenClaw and Hermes plugins, CLIs, and packages, with the tests and releases to match. — Hermes plugin."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
toolfactory = "toolfactory_hermes:register"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "toolfactory_hermes" ]

